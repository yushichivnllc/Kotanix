## 4. Thứ tự ưu tiên khi có mâu thuẫn

1. Hành vi đo được trên app đúng SHA (Android 9.8.7) — không có emulator/device trong sandbox,
   nên §1 được lấy từ **code + resource + test cùng SHA**; các điểm chỉ suy ra từ ảnh/README được
   đánh dấu `SUY RA` trong ma trận.
2. Code, resource và test ở cùng commit.
3. Ảnh minh họa trong `metadata/en-US/images/` (có khung thiết bị → chỉ để định hướng).
4. README.

Ảnh chụp trong `metadata/` **không** được dùng làm golden để so SSIM trực tiếp (khung máy +
tỷ lệ đã bị thay đổi); chúng chỉ định hướng bố cục. Chưa có ảnh đối chứng Android tự tạo tại thời
điểm viết, nên mọi màn hình đều mang trạng thái `CHƯA XÁC MINH THỊ GIÁC` cho đến khi có ảnh
Android từ thiết bị/emulator đúng SHA với bộ dữ liệu chung.

