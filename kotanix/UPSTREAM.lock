### Ghi chú quan trọng về parser bundle

`docs/BUNDLE.md` của repo parser quy định gói parser cập nhật được gửi cho app Android là **DEX**
(Android executable), **không phải JAR chạy trên JVM**. Kotanix không nạp DEX/APK, không dùng key
hay kênh cập nhật của upstream làm của mình. Bản phát hành Kotanix mặc định phân phối parser
(đã build từ revision ghim, nếu khả dụng) **cùng bản release**; hiện tại môi trường build chặn
mọi kho Maven (repo.maven.apache.org, maven.google.com, jitpack.io — xem STATUS.md), nên module
parser online **bị chặn ở mức dependency**, không phải ở mức thiết kế. Chi tiết: `STATUS.md` §5,
`docs/PORTING_MATRIX.md` §Nguồn online.

