## 7. Sai lệch đã ghi nhận: androidx.collection

- Parser ghim `androidx-collection = "1.5.0"`; repo app ghim `collections = "1.5.0"`.
- Sandbox không tải được Maven artifact 1.5.0 (mọi host Maven bị chặn) nên phải build từ source.
- Tag `collection-1.5.0` không tìm được trong phạm vi fetch cho phép; `git log -S` trên sparse
  clone bị timeout nên không xác định được commit 1.5.0 một cách đáng tin.
- Quyết định: build từ androidx/androidx `collection/collection` **tại tip của nhánh main
  (`COLLECTION = "1.8.0-alpha01"`)**, commit `cfa6d5ad3e3333bc4f0a6bdf02a3fa577aea11e2`.
  API `SimpleArrayMap`/`ArrayMap`/`ScatterMap`… mà parser dùng không đổi đáng kể so với 1.5.0.
- Hệ quả: JAR `androidx-collection-1.8.0-alpha01.jar` build được có API mới hơn parser pin.
  Khi có thể, fetch đúng tag `collection-1.5.0` (hoặc commit tương ứng) và build lại; khi đó
  chỉ cần đổi nguồn sparse clone, không phải đổi pipeline.
- Java sources (ArrayMap.java, ArraySetJvmUtil.java, package-info.java) được port thủ công sang
  Kotlin tại `thirdparty/androidx-collection-overlay/` (semantic giữ nguyên). SimpleArrayMap.
  getOrDefault được đổi tên thành `getOrDefaultArrayMap` trong bước post-flatten
  (`tools/patch-acollection-simplearraymap.py`) để tránh clash mapped-type với JDK8 default method;
  hành vi runtime không đổi.
- Okio được build từ source bằng `tools/flatten-mpp.py` (xoá expect/ghi lại default tham số
  xuyên file, strip phần JS/annotation JVM không được phép) + `tools/make-jar.py`
  (đóng gói JAR xác định, timestamp cố định). Không chỉnh sửa source gốc trong repo
  (xoá expect/annotation chỉ xảy ra trên bản copy trong `build/deps/`).
- `flatten-mpp.py` còn chèn `mustCreate: Boolean = false` v.v. vào các `actual fun` đa dòng
  có generic (ví dụ `FileSystem.write`), khớp với default của `expect` tương ứng.

